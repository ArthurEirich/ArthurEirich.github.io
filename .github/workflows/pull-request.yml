name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test analytics, consent and contact
        run: node --test .github/scripts/test_analytics.mjs .github/scripts/test_consent.mjs .github/scripts/test_contact.mjs
      - name: Test IndexNow
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -v
      - name: Validate disabled and enabled Pages output
        run: |
          python3 .github/scripts/build_pages.py
          python3 .github/scripts/validate_pages.py
          CF_PAGES_BRANCH=main CONVERSION_ANALYTICS_ENABLED=true python3 .github/scripts/build_pages.py
          python3 .github/scripts/validate_pages.py
          CF_PAGES_BRANCH=main CONTACT_BACKEND_ENABLED=true TURNSTILE_SITE_KEY=isolatedMockSiteKey python3 .github/scripts/build_pages.py
          python3 .github/scripts/validate_pages.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install locked browser test dependencies
        working-directory: .github/scripts/browser-deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium and system dependencies
        working-directory: .github/scripts/browser-deps
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Test consent and contact in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.github/scripts/browser-deps/node_modules/playwright
        run: node --test .github/scripts/test_browser.cjs
