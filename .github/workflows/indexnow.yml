name: IndexNow

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      submit:
        description: Send the pending production delta to IndexNow (off for a dry run)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  indexnow:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'check_run' ||
       (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
        github.event.check_run.name == 'Cloudflare Pages' &&
        github.event.check_run.conclusion == 'success'))
    concurrency:
      group: indexnow-cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile production with IndexNow
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          INDEXNOW_SUBMIT: ${{ github.event_name != 'workflow_dispatch' || inputs.submit }}
        run: python3 -u .github/scripts/indexnow.py
      - name: Save production checkpoint
        if: steps.reconcile.outputs.checkpoint == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: indexnow-cloudflare-production-v1
          path: ${{ runner.temp }}/indexnow-checkpoint.json
          if-no-files-found: error
          overwrite: true
